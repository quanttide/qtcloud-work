# studio 的质量门禁：改了 studio 就往这跑 analyze 与 test。
#
# 与 CLI 那套门禁对齐（见 release-cli.yml 的 quality-gates）。
# 发布前另有一道同样的门禁，见 release-studio.yml——两处的分工是：
# 这里给日常反馈，那里保证「门禁没过就不部署」。

name: quality-studio

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/studio/**'
      - '.github/workflows/quality-studio.yml'
  pull_request:
    paths:
      - 'src/studio/**'
      - '.github/workflows/quality-studio.yml'

concurrency:
  group: quality-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: 门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/studio
    steps:
      - uses: actions/checkout@v5

      - name: setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test
