# 发布 CLI：推送 tag（cli/*，如 cli/v0.1.0）时：
#   check → quality-gates → build-binaries（多平台矩阵）→ upload-release-assets → publish-crate（crates.io）
# 结构对齐 quanttide-connect / quanttide-execute 的 release-cli.yml。

name: release-cli

on:
  push:
    tags:
      - 'cli/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/cli/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#cli/}" >> $GITHUB_OUTPUT
      - name: validate version
        run: ./scripts/validate-version.sh "${{ github.ref_name }}"
      - name: validate changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ./scripts/validate-changelog.sh "${VERSION#v}"

  quality-gates:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --check
      - name: test
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --locked -- -A warnings
      - name: publish dry run
        run: cargo publish --dry-run --locked --registry crates-io

  build-binaries:
    needs: quality-gates
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: build binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: upload binary
        uses: actions/upload-artifact@v5
        with:
          name: qtcloud-work-${{ matrix.target }}
          path: ${{ github.workspace }}/src/cli/target/${{ matrix.target }}/release/qtcloud-work${{ matrix.ext }}

  upload-release-assets:
    needs: [check, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: qtcloud-work-*
          path: release-assets
      - name: normalize asset names
        run: |
          mv release-assets/qtcloud-work-x86_64-unknown-linux-gnu/qtcloud-work release-assets/qtcloud-work-linux-x86_64
          mv release-assets/qtcloud-work-aarch64-apple-darwin/qtcloud-work release-assets/qtcloud-work-macos-arm64
          mv release-assets/qtcloud-work-x86_64-pc-windows-msvc/qtcloud-work.exe release-assets/qtcloud-work-windows-x86_64.exe
          chmod +x release-assets/qtcloud-work-linux-x86_64 release-assets/qtcloud-work-macos-arm64
      - name: ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
      - name: mark prerelease when applicable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#cli/}"
          case "$VERSION" in
            *-alpha.*|*-beta.*|*-rc.*)
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
              ;;
          esac
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-assets/qtcloud-work-linux-x86_64
          release-assets/qtcloud-work-macos-arm64
          release-assets/qtcloud-work-windows-x86_64.exe
          --repo "$GITHUB_REPOSITORY" --clobber

  publish-crate:
    needs: [quality-gates, upload-release-assets]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: publish to crates.io
        env:
          CRATE_NAME: qtcloud-work-cli
          CRATE_VERSION: ${{ needs.check.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")"
          case "$status" in
            200)
              echo "${CRATE_NAME}@${CRATE_VERSION} 已存在于 crates.io，跳过重复发布。"
              ;;
            404)
              cargo publish --locked --registry crates-io
              ;;
            *)
              echo "无法确认 ${CRATE_NAME}@${CRATE_VERSION} 是否已发布（HTTP ${status}）。" >&2
              exit 1
              ;;
          esac
