[package]
name = "qtcloud-work-cli"
version = "0.1.0-alpha.4"
edition = "2024"
description = "量潮工作云命令行工具"
authors = ["QuantTide <opensource@quanttide.com>"]
license = "Apache-2.0"
repository = "https://github.com/quanttide/qtcloud-work"
readme = "README.md"
keywords = ["qtcloud", "quanttide", "work", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "qtcloud-work"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = "2"
