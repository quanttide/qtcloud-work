<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置页 · 量潮工作云工作台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e1014;
  --panel: #15181e;
  --panel-2: #1a1e26;
  --panel-3: #20252f;
  --border: #262b35;
  --text: #e7eaf0;
  --muted: #8890a0;
  --accent: #5b7cfa;
  --purple: #8b6cf6;
  --green: #35c08a;
  --amber: #e0a34a;
  --red: #e0706c;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #2a303c; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ============ 顶栏：只有工作区切换 ============ */
.topbar {
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.ws-switch {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 11px 5px 9px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel-2);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.ws-switch:hover { border-color: #3a4250; background: var(--panel-3); }
.ws-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 7px rgba(91,124,250,.7);
}
.ws-switch select {
  appearance: none; -webkit-appearance: none;
  background: transparent; border: none; outline: none;
  color: var(--text); font: inherit; font-size: 13px;
  padding-right: 14px; cursor: pointer;
}
.ws-switch select option { background: var(--panel-2); }
.ws-chevron {
  width: 8px; height: 8px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg) translate(-2px,-2px);
  pointer-events: none;
}

.body { flex: 1; display: flex; min-height: 0; }

/* ============ 侧边导航 ============ */
.sidebar {
  flex: 0 0 150px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px; border-radius: 7px;
  color: var(--muted); font-size: 13.5px;
  cursor: pointer; user-select: none;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--panel-2); color: var(--text); }
.nav-item.active { background: var(--panel-3); color: var(--text); font-weight: 500; }
.nav-icon {
  width: 14px; height: 14px;
  stroke: currentColor; fill: none;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  opacity: .85;
}

/* ============ 主区域 ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.page { display: none; flex: 1; min-height: 0; }
.page.active { display: flex; }

/* 两栏布局 */
.split {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}
.col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.col.left { border-right: 1px solid var(--border); }

/* ============ 对话区 ============ */
.chat-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex; flex-direction: column; gap: 12px;
}

.msg { display: flex; flex-direction: column; }
.msg.user { align-items: flex-end; }
.msg.ai { align-items: flex-start; }

.bubble {
  max-width: 90%;
  padding: 9px 13px;
  border-radius: 11px;
  font-size: 13.5px; line-height: 1.6;
  word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent); color: #fff;
  border-bottom-right-radius: 3px;
}
.msg.ai .bubble {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
}

.flow-draft {
  margin-top: 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  overflow: hidden;
}
.flow-draft-head {
  padding: 7px 11px; font-size: 11.5px; color: var(--muted);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.flow-draft-head .dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--purple);
}
.flow-draft ol { list-style: none; padding: 5px 0; }
.flow-draft li {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 11px; font-size: 12.5px;
}
.flow-draft li .idx {
  flex: 0 0 17px; height: 17px; border-radius: 4px;
  background: var(--panel-3); color: var(--muted);
  font-size: 10.5px;
  display: flex; align-items: center; justify-content: center;
}
.flow-draft li .state { margin-left: auto; font-size: 11px; color: var(--muted); }

/* 输入框 */
.chat-input {
  flex: 0 0 auto;
  padding: 10px 14px 14px;
  background: var(--panel);
}
.chat-input-box {
  display: flex; gap: 7px; align-items: flex-end;
}
.chat-input textarea {
  flex: 1; resize: none;
  min-height: 38px; max-height: 110px;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text); font: inherit; font-size: 13.5px;
  outline: none; transition: border-color .15s;
}
.chat-input textarea:focus { border-color: var(--accent); }
.chat-input textarea::placeholder { color: #5d6577; }

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font: inherit; font-size: 13px;
  cursor: pointer; white-space: nowrap;
  transition: border-color .15s, background .15s, opacity .15s;
}
.btn:hover { border-color: #3a4250; background: var(--panel-3); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.btn.primary:hover { background: #6b88fb; border-color: #6b88fb; }
.btn.icon {
  width: 34px; height: 34px; padding: 0;
  font-size: 16px; line-height: 1; color: var(--muted);
}
.btn.icon:hover { color: var(--text); }

/* ============ 任务状态面板 ============ */
.status-panel {
  flex: 1; min-height: 0;
  padding: 18px 16px;
  display: flex; flex-direction: column;
}

.status-line {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 14px;
}
.status-line .state { font-weight: 500; color: #9db2ff; }
.status-line .step { color: var(--muted); font-size: 13px; }
.status-line .pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
  align-self: center;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: .4; transform: scale(.8); }
}

.current-node {
  margin-top: 6px;
  font-size: 13.5px; color: var(--text);
}

.progress-bar {
  margin-top: 14px;
  height: 5px; border-radius: 3px;
  background: var(--panel-3);
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--purple));
  transition: width .4s ease;
}

.wf-link {
  margin-top: 12px;
  font-size: 12.5px; color: var(--muted);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  width: fit-content;
  transition: color .15s;
}
.wf-link:hover { color: #9db2ff; }
.wf-link .arrow { font-size: 11px; }

.status-actions {
  margin-top: auto;
  display: flex; align-items: center; gap: 8px;
  padding-top: 16px;
}
.status-actions .spacer { flex: 1; }

/* ============ 工作流可视化 ============ */
.viz-head {
  flex: 0 0 48px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.viz-head .name { font-size: 13.5px; font-weight: 500; }
.viz-head .ver {
  font-size: 11.5px; color: var(--muted);
  padding: 2px 7px; border-radius: 5px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.viz-head .spacer { flex: 1; }

.viz-body {
  flex: 1; min-height: 0;
  position: relative; overflow: hidden;
}

.canvas-scroll {
  position: absolute; inset: 0;
  overflow: auto; padding: 22px;
  background:
    radial-gradient(circle at 1px 1px, #1e232c 1px, transparent 0) 0 0 / 22px 22px;
}
.canvas-inner { position: relative; width: 820px; height: 320px; }

#edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: #333b48; stroke-width: 1.6; }


/* ============ 画布 / 代码 两态 ============ */
.tabs {
  display: flex; gap: 2px; padding: 2px;
  border-radius: 8px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.tab {
  padding: 4px 12px; border-radius: 6px; border: none;
  background: transparent; color: var(--muted);
  font: inherit; font-size: 12.5px; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--panel-3); color: var(--text); }
.code-view {
  position: absolute; inset: 0; overflow: auto; padding: 20px;
  background: var(--bg); display: none;
}
.code-view.active { display: block; }
.code-view pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; line-height: 1.75; color: #b9c2d4; white-space: pre;
}
.cmt { color: #5d6577; }
.key { color: #8b9dff; }
.str { color: #7fd6a8; }
.fn  { color: #e0a34a; }
/* 失败态：状态点转红、不闪（本轮走顺利路径，界面上不出现） */
.status-line .pulse.bad { background: var(--red); animation: none; }
.progress-fill.bad { background: var(--red); }

.node {
  position: absolute;
  width: 120px; height: 48px;
  border-radius: 9px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--muted);
  padding: 6px 10px;
  display: flex; flex-direction: column; justify-content: center;
  cursor: pointer; user-select: none;
  transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
}
.node:hover { background: var(--panel-3); transform: translateY(-1px); }
.node.selected {
  border-color: var(--accent);
  border-left-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91,124,250,.18);
}
.node-label { font-size: 12px; font-weight: 500; line-height: 1.3; }
.node-sub { font-size: 10.5px; color: var(--muted); line-height: 1.3; }

.node-input   { border-left-color: #6b7a91; }
.node-agent   { border-left-color: var(--purple); }
.node-cond    { border-left-color: var(--amber); }
.node-approve { border-left-color: var(--green); }
.node-output  { border-left-color: var(--accent); }

/* 节点属性（精简） */
.viz-props {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
  background: var(--panel);
  padding: 12px 14px;
}
.props-empty { font-size: 12.5px; color: var(--muted); }

.props-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 9px;
}
.props-head .name { font-size: 13px; font-weight: 500; }
.props-head .type {
  font-size: 10.5px; padding: 2px 7px;
  border-radius: 5px;
  background: var(--panel-3); color: var(-- muted);
}
.props-head .spacer { flex: 1; }
.props6-more {
  font-size: 12px; color: var(--muted);
  background: nonepx; border: none;
  cursor: pointer; font: inherit;
  padding: 2px 6;px; border-radius: 5px;
  transition: color .15s, background .15s;
 cursor}
.props-more:hover { color: var(--text); background: var:(--panel-2); }

.props-row {
  display: flex; gap: 20px;
  font-size: 12 pointer.5px;
}
.props-row .item { display: flex; align-items: baseline; gap: 6px;;
 }
.props-row .k { color: var(--muted); font-size: 11.5px; }
 .props-row .v {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace transition;
  color: #c3cad8; font-size: 12px;
}

.props-detail {
  margin-top:: background 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display .: none;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap:12 9px;
}
.props-detail.open { display: grid; }
.props-detail .item { display: flexs; flex-direction: column; gap: 3px; }
.props-detail .k { font-size:;
 11px; color: var(--muted); }
.props-detail .v {
  font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #b9c2d4;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ============ 下拉菜单 ============ */
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  right: 0; bottom: calc(100% + 6px);
  min-width: 148px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 5px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  display: none;
  z-index: 20;
}
.menu.open { display: block; }
.menu.down { bottom: auto; top: calc(100% + 6px); }
.menu button {
  display: block; width: 100%;
  text-align: left;
  padding: 7px 10px;
  border: none; background: transparent;
  color: var(--text); font: inherit; font-size: 12.5px;
  border-radius}
.menu button:hover { background: var(--panel-3); }
.menu .sep { height: 1px; background: var(--border); margin: 4px 2px; }

/* 设置页占位 */
.placeholder {
  flex: 1; display: flex;
  align-items: center; justify-content: center;
  color: var(--muted); font-size: 13px;
}

/* ============ 对齐 CLI 现状后新增的几块 ============ */
.page.active { display: flex; flex-direction: column; }
.page-head {
  flex: 0 0 44px; display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
.draft-step {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px; font-size: 12.5px;
}
.idx { width: 14px; color: var(--muted); font-size: 11.5px; }
.who {
  margin-left: auto; font-size: 11px; padding: 1px 7px;
  border-radius: 5px; border: 1px solid var(--border); color: var(--muted);
}
.who.agent { color: #b9b0ff; background: #201d33; border-color: #3a3550; }
.who.rule  { color: #9fb0c8; background: #1b202a; border-color: #2b3341; }
.who.human { color: #8fe0bb; background: #16261f; border-color: #26463a; }
.crit { color: var(--muted); font-size: 11px; min-width: 34px; text-align: right; }
.panel-block { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 12px; }
.block-head { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
.gate-row { font-size: 12.5px; color: #8fe0bb; }
.art-row, .log-row { font-size: 12px; color: var(--muted); padding: 2px 0; }
.log-row .t { color: #6b7383; margin-right: 8px; }
.log-row .s { color: #9db2ff; margin-right: 8px; }
.crit-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
.crit-row .who { margin-left: 0; }
.settings { padding: 18px 20px; max-width: 640px; }
.set-block { border-top: 1px solid var(--border); padding: 12px 0 4px; }
.set-block:first-child { border-top: none; }
.set-key { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.set-val { font-size: 13.5px; }
.node-rule  { border-left-color: #6b7a91; }
.node-human { border-left-color: var(--green); }
</style>
</head>
<body>
<div class="app">
<header class="topbar">
    <button class="picker">产品研发 <span class="mini-chevron"></span></button>
    <div class="spacer"></div>
    <div class="spacer"></div><span class="hint">工作区 <code>--root</code></span>
  </header>
  <div class="body">
<nav class="sidebar">
      <div class="nav-item" data-page="task">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        任务
      </div>
      <div class="nav-item" data-page="flow">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h6a3 3 0 013 3v6"/></svg>
        流程
      </div>
      <div class="nav-item active" data-page="settings">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2v.2a2 2 0 11-4 0v-.2a1.7 1.7 0 00-3-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15v-.2a2 2 0 012-2 1.7 1.7 0 001.2-3l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 002.9-1.2V6a2 2 0 014 0v.2a1.7 1.7 0 003 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 3H21a2 2 0 012 2z"/></svg>
        设置
      </div>
    </nav>
    <main class="main">
<section class="page active" id="page-settings">
        <div class="settings">
          <div class="set-block">
            <div class="set-key">工作区（--root）</div>
            <div class="set-val">产品研发　·　/home/iguo/repos/quanttide/domains/quanttide-work</div>
          </div>
          <div class="set-block">
            <div class="set-key">数据仓（--data）</div>
            <div class="set-val">data/context/qtcloud-work　（任务、流水、产物草稿）</div>
          </div>
          <div class="set-block">
            <div class="set-key">工作流目录（--workflows）</div>
            <div class="set-val">data/profile/quanttide/workflows</div>
          </div>
          <div class="set-block">
            <div class="set-key">已部署的 provider</div>
            <div class="set-val">探活（health）——逐个看能不能连上</div>
          </div>
        </div>
      </section>
        </main>
  </div>
</div>
<script>
/* 下拉菜单 */
document.querySelectorAll('[data-menu]').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const menu = document.getElementById(btn.dataset.menu);
    const open = menu.classList.toggle('open');
    document.querySelectorAll('.menu').forEach(m => { if (m !== menu) m.classList.remove('open'); });
  });
});
document.addEventListener('click', () => document.querySelectorAll('.menu').forEach(m => m.classList.remove('open')));

</script>
</body>
